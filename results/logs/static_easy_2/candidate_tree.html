<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.5771, "parents": "0", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, a summary of information gathered so far (summary_1), and a set of additional passages. Your task is to write a concise and coherent summary of the relevant facts that combine the previously gathered information (summary_1) with any new relevant details from the additional passages. \n\nWhen generating the summary, ensure that:\n\n1. The summary directly addresses the question by including all pertinent facts that help answer it.\n2. You integrate information from both the initial summary and the new passages, resolving any overlaps or contradictions.\n3. You highlight key domain-specific or niche factual details that are essential to the question\u2019s answer, such as:\n   - Publication dates and relationships between literary works and authors (e.g., Mark Twain\u2019s novels and characters).\n   - Attribution of concepts or terms to specific individuals and their works (e.g., the creator of the Law of Jante and its origin).\n   - Precise geographic or contextual distinctions, especially when clarifying locations or entities that may be confused (e.g., airports located in Florida versus those outside it).\n4. Avoid including unrelated information or passages that do not contribute to answering the question.\n5. Maintain factual accuracy and clarity, ensuring the summary is succinct but comprehensive enough to stand alone as an answer.\n6. Use exact names, titles, dates, and relationships as provided in the passages to preserve domain-specific correctness.\n\nIn summary, your response should be a brief but factually rich synthesis that combines previously gathered information with new relevant data from the passages, specifically tailored to directly answer the user\u2019s question with domain-specific precision and clarity."}},
{"idx": 2, "score": 0.6218, "parents": "1", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, a previously gathered summary (summary_1), and a set of additional passages. Your task is to produce a concise, coherent, and factually accurate summary that directly answers the question by integrating information from both summary_1 and the new passages.\n\nTo do this effectively, follow these detailed guidelines:\n\n1. **Directly Address the Question:**  \n   - Include all relevant facts from both summary_1 and the new passages that help answer the question precisely.  \n   - Exclude any information that does not contribute to answering the question.\n\n2. **Integrate and Reconcile Information:**  \n   - Combine data from summary_1 and the passages, resolving any overlaps, contradictions, or redundancies.  \n   - When conflicts arise, prioritize accuracy and domain-specific correctness.\n\n3. **Preserve Domain-Specific and Niche Details:**  \n   - Use exact names, titles, dates, and relationships as provided in the input to maintain factual precision.  \n   - Highlight key domain-specific facts essential to the question\u2019s answer, such as:  \n     - **Literary works and authors:** publication dates, character relationships, and authorial attributions (e.g., Mark Twain\u2019s novels and characters).  \n     - **Attribution of concepts or terms:** who coined or invented a term or concept, including the original work or context (e.g., the Law of Jante and its creator).  \n     - **Geographic and contextual clarifications:** precise distinctions between similar or confusable entities (e.g., airports in Florida versus those outside Florida).  \n     - **Scientific or technical inventions:** inventor names, nationalities, invention dates, and relevant biographical context.  \n     - **File formats and software compatibility:** exact file formats, their creators, and compatibility details.\n\n4. **Maintain Succinctness and Clarity:**  \n   - The summary should be brief but comprehensive enough to stand alone as a clear answer.  \n   - Avoid unnecessary details, tangents, or unrelated information.\n\n5. **Use Formal, Clear Language:**  \n   - Write in complete sentences with proper grammar and punctuation.  \n   - Avoid ambiguous terms or vague references. Use the exact terminology provided.\n\n6. **General Strategy:**  \n   - Start by identifying the key facts in summary_1 that relate to the question.  \n   - Scan the passages for additional relevant facts, especially those enriching, clarifying, or correcting summary_1.  \n   - Synthesize these into a single, integrated summary that directly answers the question with factual rigor.\n\nBy following these instructions, your response will be a precise, domain-aware synthesis of existing and newly provided information, tailored to answer the user\u2019s question accurately and comprehensively."}},
{"idx": 3, "score": 0.662, "parents": "0", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You will be provided with three inputs:  \n1. A question that needs to be answered.  \n2. A current summary of the relevant information gathered so far related to the question.  \n3. A set of additional passages containing new information.  \n\nYour task is to write a concise, coherent summary that integrates the newly provided passages with the existing summary to update and enrich the relevant facts needed to answer the question.  \n\nKey points to follow:  \n- Focus exclusively on information that is directly relevant to answering the question.  \n- Combine and reconcile facts from the existing summary and the new passages, clarifying timelines, ownerships, locations, or other domain-specific details as applicable.  \n- When dates, ownerships, or technical specifics are mentioned, incorporate them accurately to improve the completeness of the summary.  \n- If multiple entities or events are mentioned, clearly distinguish and compare them if it helps answer the question (e.g., which mine was in operation first, or which company produced a specific film).  \n- Avoid introducing unrelated information from the passages that does not contribute to answering the question.  \n- Maintain clarity and brevity, providing a focused update on the known facts.  \n- If the new passages add no relevant information beyond what is already summarized, confirm that in the summary.  \n\nThis approach ensures the evolving summary remains a precise, integrated, and factually accurate foundation for ultimately answering the question."}},
{"idx": 4, "score": 0.6357, "parents": "3", "role": "Pareto Front", "components": {"final_answer": "You are given a question and multiple summaries containing information relevant to answering the question. Your task is to provide a concise, accurate answer to the question using only the information contained in the summaries. \n\n- Respond with only the answer, in the form of a short phrase, name, entity, or list of entities separated by commas, as appropriate. \n- Do not include any explanations, elaborations, or additional commentary. \n- If multiple summaries contain overlapping or identical information, consolidate it into a single, clear answer.\n- If the question asks for multiple items (e.g., teams, people), list all relevant entities mentioned in the summaries.\n- Use exact names or terms as they appear in the summaries to maintain factual accuracy.\n- If the question asks for a specific attribute (e.g., nationality, profession), provide only that attribute as stated in the summaries.\n- Do not infer or add information beyond what is explicitly provided in the summaries.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You will be provided with three inputs:  \n1. A question that needs to be answered.  \n2. A current summary of the relevant information gathered so far related to the question.  \n3. A set of additional passages containing new information.  \n\nYour task is to write a concise, coherent summary that integrates the newly provided passages with the existing summary to update and enrich the relevant facts needed to answer the question.  \n\nKey points to follow:  \n- Focus exclusively on information that is directly relevant to answering the question.  \n- Combine and reconcile facts from the existing summary and the new passages, clarifying timelines, ownerships, locations, or other domain-specific details as applicable.  \n- When dates, ownerships, or technical specifics are mentioned, incorporate them accurately to improve the completeness of the summary.  \n- If multiple entities or events are mentioned, clearly distinguish and compare them if it helps answer the question (e.g., which mine was in operation first, or which company produced a specific film).  \n- Avoid introducing unrelated information from the passages that does not contribute to answering the question.  \n- Maintain clarity and brevity, providing a focused update on the known facts.  \n- If the new passages add no relevant information beyond what is already summarized, confirm that in the summary.  \n\nThis approach ensures the evolving summary remains a precise, integrated, and factually accurate foundation for ultimately answering the question."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.58)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.62)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.66)", fillcolor=cyan, tooltip=" "];
    4 [label="4\\n(0.64)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    3 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
