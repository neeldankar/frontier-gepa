{"idx": 1, "score": 0.5799, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that requires a factual answer.  \n2. A preliminary summary of information already gathered relevant to the question.  \n3. A set of additional passages containing new factual information potentially relevant to the question.\n\nYour task is to produce a concise, integrated summary of all the relevant facts needed to answer the question, combining the previously gathered summary with the new information from the passages.  \n\nWhen composing the summary:  \n- Focus only on facts directly relevant to answering the question.  \n- Update or refine the existing summary by incorporating any new relevant data from the passages.  \n- Exclude unrelated or extraneous information, even if present in the passages.  \n- When dates, birth years, or event timelines are involved, explicitly connect them to the entities in question to clarify comparisons or sequences.  \n- Preserve domain-specific details that clarify identities (e.g., distinguishing between people with the same name by profession or birthdate).  \n- Use clear, straightforward language to state relationships, timelines, or comparisons needed to answer the question.  \n- Avoid introducing information not supported by the provided summary or passages.\n\nThis task requires careful synthesis of biographical, historical, or event-specific factual data, often involving:  \n- Dates of birth or death, chronological order, or age comparisons.  \n- Key historical events with start/end dates or outcomes.  \n- Specific season details or performance statistics in sports contexts.  \n- Distinguishing between individuals with similar names through contextual clues (such as occupation or birthdate).\n\nYour output should be a brief but comprehensive factual summary that directly supports answering the question, integrating new information smoothly with what was previously known."}},
{"idx": 2, "score": 0.6152, "parents": "1", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that requires a factual, concise answer.  \n2. A preliminary summary of relevant information already gathered that relates directly to the question.  \n3. A set of additional passages containing new factual information potentially relevant to the question.\n\nYour task is to produce a clear, integrated, and concise summary that combines the existing summary with any new relevant facts from the passages to best support answering the question.\n\nGuidelines for composing the summary:  \n- Include only facts that are directly relevant to answering the question; exclude any unrelated or extraneous details, even if present in the passages.  \n- Update or refine the existing summary by incorporating new factual data, correcting or clarifying details as needed.  \n- When the question involves dates, birth years, event timelines, or chronological order, explicitly connect these dates or timelines to the entities involved to clarify comparisons, sequences, or distinctions.  \n- When multiple individuals share the same name or similar identifiers, preserve domain-specific details (such as professions, birthdates, or roles) that clearly distinguish them.  \n- Use clear, straightforward language to state relationships, sequences, or comparisons necessary to answer the question.  \n- Avoid introducing any information not supported by the original summary or the provided passages.  \n- The summary should be brief yet comprehensive, directly supporting the factual answer to the question without superfluous content.\n\nDomain-specific considerations:  \n- For biographical or historical questions, emphasize exact birth/death years, event start/end dates, and chronological order to clarify timelines or age comparisons.  \n- For sports-related questions, preserve details such as player birth year, team, season year, performance statistics (e.g., saves blown, injuries), and event outcomes, to distinguish between players and seasons.  \n- For institutions or locations, specify precise geographic data (e.g., city, state, country) to distinguish between similarly named entities.  \n- For questions about individuals with similar names, use contextual clues like occupation, team affiliation, or birthdate to differentiate them clearly.\n\nApproach:  \n- Carefully synthesize the preliminary summary and new passages to extract and integrate relevant factual information.  \n- Maintain a logical flow that makes the summary easy to understand and directly useful for answering the question.  \n- Ensure all factual claims can be traced back to either the preliminary summary or the additional passages.\n\nThe final output should be a concise, integrated factual summary that directly supports answering the question, combining all relevant information from both the prior summary and new passages."}},

ground information from the passages that do not advance understanding of the question.\n\n7. **Maintain neutrality and objectivity:** Present facts without speculation or opinion.\n\nExample of general approach:\n- Identify key entities and facts from the question and summary_1.\n- Scan the passages for additional details about those entities or related events.\n- Combine and rephrase these details into a unified, factual summary that directly supports answering the question.\n\nBy following these steps, the summary you produce will effectively consolidate prior knowledge with new evidence to provide a clear and accurate factual basis relevant to the question."}},
{"idx": 4, "score": 0.6604, "parents": "0", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Your task is to write a brief, focused summary of the factual information from the passages that is directly relevant to answering the question. \n\nWhen creating the summary:\n- Identify and extract only the key facts that answer the question or help determine the answer.\n- Ignore unrelated or extraneous information in the passages.\n- If the question involves comparing or relating entities (e.g., birth dates, relationships, collaborations, titles), include the relevant facts that clarify these points.\n- Use exact data from the passages when available (e.g., birth dates, roles, titles, relationships).\n- Avoid making assumptions or adding information not present in the passages.\n- Keep the summary concise and factual, synthesizing information across multiple passages if needed.\n- If multiple passages provide complementary details about the same entity or event, combine them to form a coherent summary.\n\nExamples of domain-specific details to consider:\n- Names, birth dates, and roles of individuals (e.g., directors, businesspeople, historical figures).\n- Relationships between people (e.g., familial ties, collaborations).\n- Titles and positions held (e.g., Holy Roman Emperor, co-owner).\n- Relevant events or works associated with individuals (e.g., films directed, bands formed).\n- Dates or timeframes relevant to the question (e.g., birth years, years active).\n- Specific terms or titles used historically or culturally (e.g., \"Barbarossa\" meaning \"red beard\").\n\nYour summary should be sufficient to answer the question directly or provide the necessary factual context to do so.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 5, "score": 0.6005, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs for each task instance:\n\n1. A **question** that specifies the information to be found or clarified.\n2. A **summary_1**, which is a brief initial summary of facts already gathered that are relevant to the question.\n3. A set of **additional passages** containing new information that may or may not be directly related to the question.\n\nYour task is to produce a **concise, integrated summary** of the facts relevant to answering the question by combining the initial summary (summary_1) with any pertinent information from the additional passages. \n\nKey points and guidelines for the task:\n\n- **Focus only on facts relevant to the question.** Ignore extraneous details in the passages that do not help answer the question.\n- **Integrate information from summary_1 and passages seamlessly.** Do not just restate summary_1 or passages separately; combine and synthesize the information into a unified, coherent summary.\n- When the passages add new or clarifying facts that support or refine summary_1, incorporate them to improve accuracy and completeness.\n- If the passages contradict or cast doubt on summary_1, note this in the summary and provide a balanced view or highlight uncertainty.\n- Use specific, domain-relevant details from the passages when available (e.g., dates, names, locations, events, titles) to enrich the summary.\n- Avoid introducing assumptions or unrelated information not supported by summary_1 or the passages.\n- Keep the summary brief and focused, suitable for directly answering the question.\n- Maintain clarity and coherence, ensuring the summary reads naturally as a standalone answer.\n\nThis task requires careful comprehension and selective synthesis of the input texts, emphasizing factual accuracy and relevance to the question. The output should serve as a reliable, concise factual answer combining prior knowledge (summary_1) and new evidence (passages)."}},
{"idx": 6, "score": 0.6063, "parents": "2", "role": "Pareto Front", "components": {"final_answer": "You are given a question and multiple summaries of information gathered to answer that question. Your task is to provide a concise, factual answer to the question based solely on the information in the summaries. \n\n- Your answer should be a short phrase or entity that directly responds to the question.\n- Do not include any explanations, reasoning, or additional context.\n- If multiple summaries provide complementary or overlapping information, synthesize them to produce the most accurate and complete answer possible.\n- If the summaries provide conflicting information, prioritize the summary that explicitly answers the question or provides specific data relevant to the question.\n- If the question asks for a comparison or choice (e.g., who is older), use the birth dates or relevant data given to determine the correct answer.\n- If the question refers to a record, title, compatibility, or specific attribute, extract the exact name or phrase describing that record, title, or attribute.\n- Only use information explicitly stated in the summaries; do not infer or assume facts beyond what is given.\n- Your response should be brief and to the point, typically a few words or a short phrase/entity.\n\nExample strategies:\n- For comparison questions, identify relevant dates or facts to determine the answer.\n- For attribute or record questions, identify the exact record or attribute named in the summaries.\n- For compatibility or format questions, extract the precise file format or compatibility mentioned.\n\nRespond only with the final answer, no explanations or additional text.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that requires a factual, concise answer.  \n2. A preliminary summary of relevant information already gathered that relates directly to the question.  \n3. A set of additional passages containing new factual information potentially relevant to the question.\n\nYour task is to produce a clear, integrated, and concise summary that combines the existing summary with any new relevant facts from the passages to best support answering the question.\n\nGuidelines for composing the summary:  \n- Include only facts that are directly relevant to answering the question; exclude any unrelated or extraneous details, even if present in the passages.  \n- Update or refine the existing summary by incorporating new factual data, correcting or clarifying details as needed.  \n- When the question involves dates, birth years, event timelines, or chronological order, explicitly connect these dates or timelines to the entities involved to clarify comparisons, sequences, or distinctions.  \n- When multiple individuals share the same name or similar identifiers, preserve domain-specific details (such as professions, birthdates, or roles) that clearly distinguish them.  \n- Use clear, straightforward language to state relationships, sequences, or comparisons necessary to answer the question.  \n- Avoid introducing any information not supported by the original summary or the provided passages.  \n- The summary should be brief yet comprehensive, directly supporting the factual answer to the question without superfluous content.\n\nDomain-specific considerations:  \n- For biographical or historical questions, emphasize exact birth/death years, event start/end dates, and chronological order to clarify timelines or age comparisons.  \n- For sports-related questions, preserve details such as player birth year, team, season year, performance statistics (e.g., saves blown, injuries), and event outcomes, to distinguish between players and seasons.  \n- For institutions or locations, specify precise geographic data (e.g., city, state, country) to distinguish between similarly named entities.  \n- For questions about individuals with similar names, use contextual clues like occupation, team affiliation, or birthdate to differentiate them clearly.\n\nApproach:  \n- Carefully synthesize the preliminary summary and new passages to extract and integrate relevant factual information.  \n- Maintain a logical flow that makes the summary easy to understand and directly useful for answering the question.  \n- Ensure all factual claims can be traced back to either the preliminary summary or the additional passages.\n\nThe final output should be a concise, integrated factual summary that directly supports answering the question, combining all relevant information from both the prior summary and new passages."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.58)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.62)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.61)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.66)", fillcolor=cyan, tooltip=" "];
    5 [label="5\\n(0.60)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.61)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    0 -> 4;
    0 -> 5;
    2 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
