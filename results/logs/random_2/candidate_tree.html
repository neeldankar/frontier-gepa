{"idx": 5, "score": 0.6236, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three types of inputs:\n\n1. A question that needs to be answered.\n2. A summary of the relevant information gathered so far related to the question.\n3. A set of additional passages containing new factual information.\n\nYour task is to write a concise and coherent summary that integrates the new information from the passages with the previously gathered summary. The goal is to produce an updated summary that includes all relevant facts necessary to answer the question accurately.\n\nKey details and guidelines for the task:\n\n- Focus only on facts that are directly relevant to answering the question.\n- Combine information from both the existing summary and the new passages to create a unified, factually complete summary.\n- Avoid including unrelated or extraneous details.\n- Maintain clarity and brevity, ensuring the summary is easy to understand.\n- When the passages add specific details that confirm, clarify, or expand on the original summary, incorporate those details explicitly.\n- If the passages provide new facts that correct or refine the initial summary, update the summary accordingly.\n- Use precise names, places, dates, and other factual data from the passages when relevant.\n- Do not speculate or add information not supported by the given inputs.\n- The final summary should support or enable answering the original question fully, serving as a comprehensive factual base.\n\nThis task requires careful reading and synthesis of multi-source factual data, ensuring the updated summary is accurate, relevant, and directly tied to the question at hand."}},
{"idx": 6, "score": 0.6079, "parents": "5", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three types of inputs:\n\n1. A question that needs to be answered.\n2. A summary of relevant information gathered so far related to the question.\n3. A set of additional passages containing new factual information.\n\nYour task is to produce an updated, concise, and coherent summary that integrates the new factual information from the passages with the previously gathered summary. This updated summary should be a unified, factually complete synthesis directly relevant to answering the original question.\n\nDetailed guidelines and domain-specific considerations:\n\n- Focus exclusively on facts that are directly relevant to the question.\n- Combine information from both the existing summary and the new passages, ensuring completeness and accuracy.\n- If the passages confirm, clarify, or expand the initial summary, explicitly incorporate those details.\n- If the passages provide corrections or refinements to the initial summary, update it accordingly.\n- Use precise names, dates, places, titles, and other factual data exactly as presented in the passages.\n- Avoid speculation, inferences, or adding any information not supported by the inputs.\n- Exclude any extraneous, unrelated, or tangential information.\n- Maintain clarity and brevity; the summary should be easy to understand and free of redundancy.\n- The final summary should serve as a comprehensive factual base that fully supports answering the question.\n\nApproach:\n\n- Carefully read and understand the question to identify what information is const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.59)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.58)", fillcolor=orange, tooltip=" "];

    5 [label="5\\n(0.62)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.61)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
    3 -> 4;
    0 -> 5;
    5 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
