<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.5999, "parents": "0", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A current summary of relevant facts gathered so far, which may partially address the question or highlight missing information.  \n3. A set of additional passages containing new factual information related to the question.  \n\nYour task is to produce a concise, integrated summary that combines the existing summary with the new passages to provide all relevant facts needed to answer the question.  \n\nGuidelines:  \n- Focus only on information directly relevant to answering the question. Exclude unrelated details.  \n- When the new passages provide missing facts or clarify ambiguities from the initial summary, incorporate those clearly.  \n- If the question references specific entities (people, places, events, films, etc.), explicitly connect new facts to those entities.  \n- Include domain-specific details such as dates, titles, locations, population figures, and relationships between people and works when available and relevant.  \n- If no new relevant information is found in the passages, restate the lack of new facts but integrate any contextual details that may help understand the scope of the answer.  \n- Maintain clarity and brevity: the summary should be a coherent paragraph or two that would help someone answer the question without needing to read the original passages.  \n- Avoid speculation or assumptions beyond the provided facts.  \n\nExample of effective approach:  \n- Identify key named entities or facts in the question (e.g., \"Harold Brent Wallis,\" \"Humphrey Bogart,\" \"1942 film\").  \n- Check the initial summary for partial answers or gaps.  \n- Scan new passages for direct mentions or related facts about those entities.  \n- Combine all relevant facts into a clear, fact-based summary that either answers the question or states what is unknown.  \n\nThis approach ensures the final summary is factually accurate, comprehensive with respect to the provided information, and tailored to the question asked."}},
{"idx": 2, "score": 0.6083, "parents": "1", "role": "Pareto Front", "components": {"final_answer": "You are given a question and multiple summaries containing information relevant to answering that question. Your task is to provide a concise, accurate answer to the question using only the information from the summaries. \n\n- Respond with only the final answer, as a short phrase or entity, without any explanation, elaboration, or additional commentary. \n- If the question asks for a comparison or selection between entities (e.g., which college is located in a specific country), provide only the name of the correct entity.\n- If the question asks for a specific term, nickname, file format, or similar factual detail, provide only that exact term or phrase.\n- Do not infer or add information beyond what is explicitly supported by the summaries.\n- Use capitalization and spelling as appropriate for the named entities or terms in the summaries.\n- If the summaries do not provide sufficient information to answer the question, do not guess; respond only if an answer can be confidently derived from the summaries.\n\nThis task requires precise extraction of factual information and succinct presentation of the answer without any explanation or additional text.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A current summary of relevant facts gathered so far, which may partially address the question or highlight missing information.  \n3. A set of additional passages containing new factual information related to the question.  \n\nYour task is to produce a concise, integrated summary that combines the existing summary with the new passages to provide all relevant facts needed to answer the question.  \n\nGuidelines:  \n- Focus only on information directly relevant to answering the question. Exclude unrelated details.  \n- When the new passages provide missing facts or clarify ambiguities from the initial summary, incorporate those clearly.  \n- If the question references specific entities (people, places, events, films, etc.), explicitly connect new facts to those entities.  \n- Include domain-specific details such as dates, titles, locations, population figures, and relationships between people and works when available and relevant.  \n- If no new relevant information is found in the passages, restate the lack of new facts but integrate any contextual details that may help understand the scope of the answer.  \n- Maintain clarity and brevity: the summary should be a coherent paragraph or two that would help someone answer the question without needing to read the original passages.  \n- Avoid speculation or assumptions beyond the provided facts.  \n\nExample of effective approach:  \n- Identify key named entities or facts in the question (e.g., \"Harold Brent Wallis,\" \"Humphrey Bogart,\" \"1942 film\").  \n- Check the initial summary for partial answers or gaps.  \n- Scan new passages for direct mentions or related facts about those entities.  \n- Combine all relevant facts into a clear, fact-based summary that either answers the question or states what is unknown.  \n\nThis approach ensures the final summary is factually accurate, comprehensive with respect to the provided information, and tailored to the question asked."}},
{"idx": 3, "score": 0.6169, "parents": "1", "role": "Best", "components": {"final_answer": "You are given a question and one or more summaries containing information relevant to answering that question. Your task is to provide a concise, factual answer to the question based solely on the information in the summaries. \n\n- Respond with only the short phrase or entity that directly answers the question.\n- Do not include any explanations, elaborations, or additional context.\n- Use exact terms or names from the summaries when possible to ensure accuracy.\n- If multiple summaries provide overlapping information, synthesize them to provide the clearest and most direct answer.\n- The answer should be precise and domain-specific, reflecting any specialized terminology or tags mentioned in the summaries (e.g., \"Geographical Indication tag,\" \"Workers' self-management,\" or specific place names).\n- Avoid introducing any information not present in the summaries.\n\nThe goal is to produce a brief, authoritative answer that directly addresses the question using the provided summarized data only.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A current summary of relevant facts gathered so far, which may partially address the question or highlight missing information.  \n3. A set of additional passages containing new factual information related to the question.  \n\nYour task is to produce a concise, integrated summary that combines the existing summary with the new passages to provide all relevant facts needed to answer the question.  \n\nGuidelines:  \n- Focus only on information directly relevant to answering the question. Exclude unrelated details.  \n- When the new passages provide missing facts or clarify ambiguities from the initial summary, incorporate those clearly.  \n- If the question references specific entities (people, places, events, films, etc.), explicitly connect new facts to those entities.  \n- Include domain-specific details such as dates, titles, locations, population figures, and relationships between people and works when available and relevant.  \n- If no new relevant information is found in the passages, restate the lack of new facts but integrate any contextual details that may help understand the scope of the answer.  \n- Maintain clarity and brevity: the summary should be a coherent paragraph or two that would help someone answer the question without needing to read the original passages.  \n- Avoid speculation or assumptions beyond the provided facts.  \n\nExample of effective approach:  \n- Identify key named entities or facts in the question (e.g., \"Harold Brent Wallis,\" \"Humphrey Bogart,\" \"1942 film\").  \n- Check the initial summary for partial answers or gaps.  \n- Scan new passages for direct mentions or related facts about those entities.  \n- Combine all relevant facts into a clear, fact-based summary that either answers the question or states what is unknown.  \n\nThis approach ensures the final summary is factually accurate, comprehensive with respect to the provided information, and tailored to the question asked."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.61)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.62)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
