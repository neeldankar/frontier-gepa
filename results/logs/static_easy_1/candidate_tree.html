<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.6239, "parents": "0", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You will be given three inputs:  \n1. A question that asks for specific factual information.  \n2. A summary of information gathered so far that is relevant to answering the question.  \n3. A set of additional passages that may or may not contain new relevant facts related to the question.  \n\nYour task is to produce a concise, integrated summary that combines the relevant facts from the original summary and the new passages to better answer the question.  \n\nTo do this:  \n- Carefully identify the key facts from the original summary that directly address or partially address the question.  \n- Review each additional passage and extract any new, relevant factual information that supplements, confirms, or clarifies the original summary. Ignore unrelated content.  \n- Merge the original summary and the new information into a brief but comprehensive summary focused solely on facts pertinent to answering the question.  \n- If the new passages do not add any relevant information, clearly state that the original summary remains the best source of information.  \n- Avoid introducing any information not supported by the given inputs.  \n- Ensure the summary is clear, factual, and directly answers or helps answer the question.  \n\nIn essence, your output should be a fact-based, succinct synthesis of all relevant details from both the initial summary and the additional passages, tailored to the question asked."}},
{"idx": 2, "score": 0.6107, "parents": "1", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You will be given three inputs:  \n1. A question that asks for specific factual information.  \n2. A summary of information gathered so far that is relevant to answering the question.  \n3. A set of additional passages that may or may not contain new relevant facts related to the question.  \n\nYour task is to produce a concise, integrated summary that combines the relevant facts from the original summary and the new passages to better answer the question.\n\nDetailed guidelines:  \n- Carefully identify and extract key factual information from the original summary that directly or partially addresses the question.  \n- Review each additional passage thoroughly and extract any new facts that supplement, confirm, clarify, or expand on the original summary\u2019s relevant content. Ignore any unrelated or irrelevant details.  \n- Merge the original summary and the newly extracted relevant facts into a brief, coherent, and comprehensive summary focused solely on facts pertinent to the question.  \n- If none of the new passages add relevant information, explicitly state that the original summary remains the best source of information.  \n- Avoid introducing any information not supported by the original summary or the provided passages. Do not infer or assume facts beyond the given inputs.  \n- Ensure the final summary is clear, factual, succinct, and directly answers or aids in answering the question.  \n- Maintain objectivity and neutrality, presenting only verified facts without editorializing or unnecessary elaboration.  \n\nDomain-specific and task-specific considerations:  \n- The question typically targets a specific, factual detail such as a location, historical figure\u2019s role, philosophical affiliation, or other concrete data points.  \n- The original summary is often a partial answer or a foundational fact set that may require supplementation or correction by the new passages.  \n- Additional passages may include detailed historical, biographical, or geographical information that either corroborates or expands the initial summary.  \n- The summary should synthesize information seamlessly, avoiding redundancy, and clearly attributing facts to the correct entities or events as indicated.  \n- When multiple relevant facts arise, integrate them logically and chronologically if applicable (e.g., historical events, biographical timelines).  \n- When multiple figures or elements are involved (e.g., multiple commanders in a siege), clearly distinguish their roles and contributions based on the facts provided.  \n- If the new passages provide clarifications or corrections to the original summary, incorporate these updates accurately and note the refinement in the integrated summary.  \n\nIn essence, your output should be a fact-based, succinct synthesis of all relevant details from both the initial summary and the additional passages, tailored specifically to the question asked, ensuring accuracy, clarity, and completeness without extraneous content."}},
{"idx": 3, "score": 0.5916, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, an initial summary containing information gathered so far relevant to the question, and a set of additional passages. Your task is to produce a concise summary that combines the new information from the passages with the existing summary to provide a fuller, factually accurate answer to the question.\n\nWhen writing the summary, please adhere to the following guidelines:\n\n1. **Relevance:** Include only facts directly relevant to answering the question. Filter out unrelated details.\n\n2. **Integration:** Seamlessly integrate information from the new passages with the existing summary to form a coherent, unified response.\n\n3. **Factual Accuracy:** Ensure all facts presented are accurate and supported by either the initial summary or the new passages.\n\n4. **Conciseness:** Keep the summary brief and to the point, avoiding unnecessary elaboration or repetition.\n\n5. **Contextual Clarity:** When appropriate, provide necessary background context from the passages or summary to clarify who or what the entities mentioned are, especially for niche or domain-specific references.\n\n6. **Domain-Specific Knowledge:** Leverage domain-specific facts present in the input, such as:\n   - Sports: tournament names, player achievements, team rivalries, award years, and player roles.\n   - Legal/Criminal cases: charges, dates, locations, and organizational roles.\n   - Event details: dates, locations, and key figures involved.\n   - Titles and honors: awards, championships, records, and rankings.\n\n7. **Avoid Contradictions:** If new passages contradict previous summary information, prioritize the most recent or detailed passage unless there is a clear reason not to.\n\n8. **No Extraneous Information:** Do not introduce information not contained in the summary or passages, even if known externally.\n\nBy following these guidelines, your output should be a succinct, accurate, and integrated factual summary that answers the question based on all information provided."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.62)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.61)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.59)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
