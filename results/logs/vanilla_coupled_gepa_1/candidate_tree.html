nformation gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},

ct of the question, explicitly state that the relevant information is not present.\n- Summaries should be brief, factual, and avoid speculation or unsupported inference.\n\nIn summary, your output should be a focused factual synthesis drawn solely from the passages, tailored to directly answer the question posed.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},

an existing summary of facts gathered so far (summary_1), and a set of additional passages. Your task is to produce a concise, accurate, and coherent updated summary that combines the prior summary with relevant new information found in the additional passages to help answer the question.\n\nSpecifically:\n\n1. Identify the key entities and facts from the existing summary that are relevant to the question.\n\n2. Carefully read the additional passages and extract any new, relevant factual information that directly pertains to the question or clarifies/improves the existing summary.\n\n3. Integrate the new information with the existing summary to create a brief but comprehensive updated summary. The updated summary should:\n   - Correct any inaccuracies if found in the original summary.\n   - Avoid adding irrelevant information or unrelated details from the new passages.\n   - Explicitly mention the relevant connections between people, organizations, inventions, or concepts as they relate to the question.\n   - Include clarifications when the new passages provide better or more precise information about the entities involved.\n   - If the new passages do not add relevant information, clearly state that no new relevant facts were found.\n\n4. Maintain factual accuracy and domain-specific terminology as presented in the passages.\n\n5. When multiple entities or facts appear in the passages that are not relevant to the question, exclude them from the summary to keep it focused.\n\n6. Use clear, concise language, and avoid redundancy.\n\nThis task requires combining partial prior knowledge with new evidence, verifying consistency, and producing a focused factual summary tailored to the question. Your output should help a reader understand the key facts relevant to answering the question, synthesized from all available information."}},
{"idx": 5, "score": 0.623, "parents": "2", "role": "Best", "components": {"final_answer": "You are given a question along with multiple summaries containing information relevant to answering that question. Your task is to extract the correct and concise answer based solely on the information provided in the summaries. \n\n- Provide the answer as a short phrase or entity only, with no additional explanation or commentary.\n- Ensure the answer directly addresses the question, resolving any contradictions or ambiguities in the summaries by synthesizing the information logically.\n- If the summaries contain conflicting information, prioritize the most specific, detailed, and directly relevant summary content to determine the correct answer.\n- Do not infer or add information beyond what is explicitly stated in the summaries.\n- The question may ask for names, dates, places, titles, nicknames, or other factual entities.\n- Your response should be brief and precise, typically a name, title, location, or a short phrase that answers the question clearly.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that asks for specific factual information.  \n2. A current summary of gathered information relevant to the question (summary_1), which may be incomplete or indicate missing details.  \n3. Additional passages containing factual data that may help answer the question or supplement the existing summary.\n\nYour task is to produce a concise but comprehensive updated summary that:  \n- Integrates the new facts from the additional passages with the previously gathered summary, focusing only on information directly relevant to answering the question.  \n- Corrects or expands the existing summary_1 as needed, based on the new passages.  \n- Clearly states what is known and, if applicable, what remains unknown or unaddressed by the combined information.  \n- Avoids including unrelated or extraneous details not pertinent to the question.  \n- When multiple entities or data points are mentioned (e.g., multiple YouTubers or athletes), include only those relevant to the question or those that help clarify the answer.  \n- If the new passages mention relevant relationships or facts (e.g., familial relations, statistics, achievements), incorporate them explicitly if they help answer the question.  \n- Maintain factual accuracy and avoid speculation beyond the provided information.\n\nIn summary, your goal is to create a factually accurate, focused, and succinct summary that merges prior knowledge with new evidence to best address the question, explicitly highlighting what is known and what is still missing."}},
{"idx": 6, "score": 0.5915, "parents": "1", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You will be given a question and several passages containing factual information about entities, events, or concepts relevant to the question. Your task is to produce a single, concise summary paragraph that extracts and integrates only the key factual details from the passages needed to answer the question accurately and completely.\n\nTo do this:\n\n- Carefully identify and select facts, data points, names, numbers, classifications, or other specific information from the passages that directly address the question.\n- Exclude any unrelated, tangential, or extraneous information that does not contribute to answering the question.\n- If the passages collectively provide a clear, direct answer or comparison, summarize that succinctly, ensuring the answer stands alone and is fully informative.\n- When the question involves entities or concepts (such as film titles, actors, songs, artists, sports teams, records, awards, or specific events), explicitly include those domain-specific details as presented in the passages.\n- For questions involving comparisons (e.g., between quantities, categories, records), ensure you include the comparative facts clearly.\n- If the question references a particular context such as a sport division, geographic location, or cultural genre, focus on information tied to that context.\n- If the passages do not provide explicit information to fully answer the question, summarize what is known from the passages and note the absence of specific details.\n- Use precise, domain-appropriate terminology consistent with the passages (e.g., film genres, awards, sports terminology, musical genres like Bhavageete, record titles, artist stage names).\n- Maintain brevity but ensure the summary is comprehensive enough to stand alone as an informative answer.\n- Format your output as a single paragraph summary integrating all relevant facts from across the passages.\n\nThis approach ensures that your summary is factual, focused, and tailored to the question, avoiding irrelevant information while including all pertinent domain-specific details to provide a clear, authoritative answer.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.56)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.60)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.61)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.59)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.62)", fillcolor=cyan, tooltip=" "];
    6 [label="6\\n(0.59)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    1 -> 4;
    2 -> 5;
    1 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
