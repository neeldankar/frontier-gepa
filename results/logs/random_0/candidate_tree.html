{"idx": 1, "score": 0.6352, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, a current summary of information gathered so far relevant to the question, and a set of additional passages containing potentially relevant information. Your task is to write a concise, accurate summary that integrates the newly provided passages with the existing summary to better answer the question.\n\nTo do this effectively:\n\n1. Identify and extract facts from the new passages that directly relate to the question or clarify key entities, roles, places, dates, or titles mentioned in the question or summary.\n\n2. Combine these newly found facts with the information already summarized, ensuring that the updated summary:\n   - Remains focused on answering the question.\n   - Avoids including irrelevant or tangential information from the additional passages.\n   - Corrects or updates any previously incomplete or inaccurate information.\n   - Maintains clarity and brevity, presenting only what is necessary to answer the question.\n\n3. If the new passages do not add relevant information, confirm this explicitly and restate the known relevant facts from the existing summary.\n\n4. When dealing with proper names, titles, historical periods, or domain-specific terms (e.g., ecclesiastical titles, political offices, or historical naming conventions), preserve their precise usage and contextual significance as found in the passages.\n\n5. Avoid speculation or inference beyond the information provided; rely solely on the facts presented in the summary and the new passages.\n\nBy following this approach, you ensure that each summary iteration incrementally builds a more complete and accurate factual basis for answering the question, while filtering out unrelated content."}},
{"idx": 2, "score": 0.6419, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A summary of the facts gathered so far that are relevant to the question.  \n3. A set of additional passages containing potentially new or supporting information related to the question.  \n\nYour task is to write a concise, integrated summary of all relevant facts by combining the information from the initial summary with any pertinent details from the additional passages. This new summary should:  \n\n- Focus strictly on facts directly relevant to answering the question.  \n- Clarify or correct any inaccuracies or gaps in the initial summary using the new passages.  \n- Incorporate domain-specific or niche factual information when present, such as:  \n  - Specific album titles, release dates, and inspirations (for music-related questions).  \n  - Precise biographical or nationality details of individuals (for film directors or similar).  \n  - Exact dates, locations, and historical context for places or events (e.g., shopping centres\u2019 opening years and locations).  \n- Avoid including unrelated information or speculative content.  \n- When the additional passages do not provide new relevant facts, reaffirm or cautiously qualify the original summary based on the available evidence.  \n- Use clear, direct language suitable for factual summaries.  \n\nIn essence, your output should be a factually accurate, succinct synthesis of all relevant information available, improving upon the initial summary by integrating and reconciling new evidence from the passages."}},

be attentive to the domain context (e.g., mines and their locations, historical figures and their roles, sports players and their teams).\n\n9. Where appropriate, explicitly mention when information from the passages does not add to or contradict the existing summary, to make clear what is or isn\u2019t known.\n\n10. Use natural, clear language suitable for a factual summary.\n\nIn essence, your role is to synthesize and update the existing summary with new relevant facts from the passages to create a final, concise, and relevant factual summary that answers the question as fully as possible using all provided information."}},
{"idx": 4, "score": 0.6236, "parents": "2", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. An initial summary of the relevant facts gathered so far, aiming to answer the question.  \n3. A set of additional passages containing potentially new, supporting, or clarifying information related to the question.  \n\nYour task is to produce a concise, integrated factual summary that synthesizes all relevant information from both the initial summary and the additional passages. This summary should:  \n\n- Focus strictly on facts directly relevant to answering the question.  \n- Use the additional passages to clarify, correct, or fill gaps in the initial summary. If no new relevant information is found, reaffirm or cautiously qualify the original summary based on available evidence.  \n- Incorporate niche or domain-specific factual details when present, such as:  \n  - For music: specific album titles, release dates, inspirations, or artist details.  \n  - For politics or government: exact titles, legislative bodies, meeting locations, district details, and biographical information of officeholders.  \n  - For sports: player names, teams, positions, relevant dates, and associated events (e.g., video game releases featuring athletes).  \n  - For geography or places: precise locations, historical context, dates of establishment, and administrative details like county seats.  \n- Avoid including unrelated information, speculation, or general background that does not directly support answering the question.  \n- Use clear, direct, and factual language appropriate for a concise summary.  \n- When reconciling conflicting information, prioritize accuracy and clarity, explicitly noting corrections or distinctions when necessary.  \n- Ensure proper identification of individuals and entities to avoid confusion (e.g., distinguishing similarly named persons, clarifying which individual held a position or starred in a game).  \n\nIn essence, your output should be a factually accurate, succinct synthesis that improves upon the initial summary by integrating, reconciling, and highlighting relevant new facts from the additional passages, thereby providing a clear and precise factual answer to the question."}},

the provided passages, without adding outside information or speculation.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 6, "score": 0.6388, "parents": "2", "role": "Pareto Front", "components": {"final_answer": "You will be given a question and two or more summaries containing information relevant to answering that question. Your task is to determine the most accurate and concise answer to the question based on the information in the summaries. \n\n- Provide your answer as a short phrase or a single entity (e.g., a name, a title, a role, or a date) that directly and precisely responds to the question.\n- Do not include any explanation, reasoning, or additional context\u2014only the final answer.\n- When the summaries contain conflicting information, prefer the answer supported by the most specific and directly relevant summary.\n- If a summary explicitly states no relevant information is available, disregard that summary in your answer.\n- Answers should be factual, domain-specific, and derived strictly from the information given in the summaries.\n- The questions may involve historical figures, fictional characters, dates, roles, or associations, so focus on extracting exact and unambiguous facts.\n  \nExample:  \nQuestion: \"Who, born February 20, 1983, played for The Monarchs and in the World Series?\"  \nSummary 1: Mentions a player born on that date but no association with The Monarchs.  \nSummary 2: Mentions a different player associated with The Monarchs but born on a different date.  \nAnswer: The player whose birthdate and team association match exactly, ignoring conflicting or irrelevant info.\n\nFollow this approach to ensure accuracy and brevity in your answer.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A summary of the facts gathered so far that are relevant to the question.  \n3. A set of additional passages containing potentially new or supporting information related to the question.  \n\nYour task is to write a concise, integrated summary of all relevant facts by combining the information from the initial summary with any pertinent details from the additional passages. This new summary should:  \n\n- Focus strictly on facts directly relevant to answering the question.  \n- Clarify or correct any inaccuracies or gaps in the initial summary using the new passages.  \n- Incorporate domain-specific or niche factual information when present, such as:  \n  - Specific album titles, release dates, and inspirations (for music-related questions).  \n  - Precise biographical or nationality details of individuals (for film directors or similar).  \n  - Exact dates, locations, and historical context for places or events (e.g., shopping centres\u2019 opening years and locations).  \n- Avoid including unrelated information or speculative content.  \n- When the additional passages do not provide new relevant facts, reaffirm or cautiously qualify the original summary based on the available evidence.  \n- Use clear, direct language suitable for factual summaries.  \n\nIn essence, your output should be a factually accurate, succinct synthesis of all relevant information available, improving upon the initial summary by integrating and reconciling new evidence from the passages."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.64)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.64)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.61)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.62)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.67)", fillcolor=cyan, tooltip=" "];
    6 [label="6\\n(0.64)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    0 -> 3;
    2 -> 4;
    0 -> 5;
    2 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
