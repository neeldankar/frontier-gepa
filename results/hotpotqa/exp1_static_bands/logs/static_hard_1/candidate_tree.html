<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.6227, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and multiple summaries containing information relevant to answering that question. Your task is to provide a concise, direct answer to the question based solely on the information in the summaries. \n\nGuidelines:\n- Respond with only the answer, as a short phrase or entity (e.g., a name, place, thing, or term).\n- Do not provide any explanations, justifications, or additional context.\n- Use only the information explicitly stated in the summaries; do not infer or add external knowledge.\n- If the summaries contain conflicting information, choose the answer supported by the majority or the most specific, direct statement.\n- Ensure that the answer precisely addresses the question asked, reflecting the most relevant and accurate detail from the summaries.\n- Maintain the original casing and spelling from the summaries when providing the answer.\n\nThis task involves extracting a fact or entity from provided text snippets to answer a factual question succinctly and accurately.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 2, "score": 0.5556, "parents": "0", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, a summary of previously gathered information relevant to the question (summary_1), and a set of additional passages containing new information. Your task is to produce a concise, integrated summary of all relevant facts from both the prior summary and the new passages to help answer the question.\n\nTo do this effectively:\n\n1. Carefully identify the core factual elements in the previously gathered summary and the new passages that directly relate to the question.\n\n2. Combine these elements into a coherent brief summary that explicitly addresses the question, ensuring that:\n   - You include any domain-specific or niche factual information found in the passages.\n   - You clarify relationships or attributions where applicable (e.g., who created a term, what profession two individuals share).\n   - If the information is missing or unavailable in the passages, clearly state that no relevant information was found.\n   \n3. Avoid introducing information not supported by the given passages or summary.\n\n4. Maintain clarity and brevity in your summary, focusing strictly on facts relevant to answering the question.\n\nThis approach ensures the output is a factually accurate, synthesized summary that directly supports answering the question by integrating both prior and new information, preserving nuanced domain-specific details as needed."}},
{"idx": 3, "score": 0.6454, "parents": "1", "role": "Best", "components": {"final_answer": "You are given a question and multiple summaries containing information relevant to answering that question. Your task is to provide a concise, direct answer to the question based solely on the information in the summaries. \n\nGuidelines:\n- Respond with only the answer, as a short phrase or entity (e.g., a name, place, thing, or term).\n- Do not provide any explanations, justifications, or additional context.\n- Use only the information explicitly stated in the summaries; do not infer or add external knowledge.\n- If the summaries contain conflicting information, choose the answer supported by the majority or the most specific, direct statement.\n- Ensure that the answer precisely addresses the question asked, reflecting the most relevant and accurate detail from the summaries.\n- Maintain the original casing and spelling from the summaries when providing the answer.\n\nThis task involves extracting a fact or entity from provided text snippets to answer a factual question succinctly and accurately.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:  \n1. A question that needs to be answered.  \n2. A brief summary of relevant information gathered so far (summary_1).  \n3. A set of additional passages containing potentially relevant facts.  \n\nYour task is to write a concise, integrated summary of the relevant facts that combines the information already gathered (summary_1) with any new relevant facts found in the additional passages. This summary should:  \n\n- Focus only on facts that directly help answer the question. Filter out unrelated or extraneous information.  \n- Integrate the new passages with the existing summary smoothly, avoiding repetition and contradictions.  \n- Include specific, domain-relevant details such as names, dates, locations, roles, and relationships when relevant to the question.  \n- Preserve factual accuracy and clarity.  \n- Keep the summary brief but sufficiently informative to answer the question based on all the information provided.  \n\nUse a generalizable approach:  \n- Identify key entities and facts from the question (e.g., people, places, events, titles, dates).  \n- Scan the existing summary and new passages for information related to those key entities and facts.  \n- Combine this information logically into a coherent and factual summary that directly addresses the question.  \n\nNote: The task involves handling diverse topics (historical events, film credits, TV shows, biographies, etc.) so adapt your extraction and summarization accordingly, always maintaining relevance to the question asked.  \n\nExample domain-specific cues you may encounter:  \n- Historical figures, dates, and events (e.g., Roger Casement, Easter Rising, execution locations).  \n- Film and TV credits (actors, producers, episode details).  \n- Character and voice actor relationships in shows (e.g., \"The Simpsons\").  \n- Organizational or military unit details related to nationalist movements.  \n\nYour output should be a single, clear paragraph that synthesizes the existing summary and new passage information relevant to the question, suitable as a direct response or foundation for answering the question accurately."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.62)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.56)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.65)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
