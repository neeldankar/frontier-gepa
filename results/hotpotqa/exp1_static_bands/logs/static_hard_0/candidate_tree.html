<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.6183, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, an initial summary of information gathered so far (summary_1), and a set of additional passages containing relevant facts. Your task is to write a concise and coherent summary that integrates the new information from the passages with the existing summary, focusing only on the facts directly relevant to answering the question.\n\nKey points to consider:\n\n- Identify and extract factual information from the additional passages that directly relate to the question.\n- Combine this new information with the facts already provided in summary_1, ensuring no contradictions or redundancies.\n- Maintain clarity, precision, and relevance; avoid including unrelated details or extraneous information.\n- When multiple related facts appear, synthesize them into a single, fluid summary that improves or expands upon the initial summary.\n- Preserve domain-specific terminology and proper names accurately (e.g., book titles, species names, report names, dates, author names).\n- The final summary should be brief but comprehensive enough to answer the question based on all gathered information.\n- Do not introduce information not supported by the provided inputs.\n- The tone should be neutral and factual.\n\nBy following these guidelines, produce a well-integrated summary that combines the initial summary with the new passages to best answer the question."}},
{"idx": 2, "score": 0.6416, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:\n1. A question that requires a factual answer.\n2. A current summary of relevant information gathered so far related to the question.\n3. A set of additional passages containing new factual information.\n\nYour task is to write a concise, coherent, and integrated summary that combines the new factual information from the additional passages with the previously gathered summary. The output summary should:\n\n- Focus only on facts that are relevant to answering the question.\n- Integrate new details smoothly with the existing summary, avoiding repetition.\n- Include specific, domain-relevant information such as book titles, authorship relations, publication dates, roles or positions held by individuals, film titles and their directors, or institutional affiliations, as appropriate to the question.\n- Preserve important contextual relationships (e.g., familial relations between authors, chronological order of works, institutional names and their alternate titles).\n- Avoid speculation or information not supported by the given passages.\n- Remain brief but sufficiently informative to fully address the question using all available data.\n\nIn essence, your summary should serve as a clear, authoritative consolidation of all relevant facts from both the initial summary and the new passages, enabling an accurate and comprehensive response to the question."}},
{"idx": 3, "score": 0.6983, "parents": "2", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages that contain factual information. Your task is to write a brief, clear, and concise summary of the key facts from the passages that are directly relevant to answering the question. \n\nTo do this effectively:\n\n1. Identify the main entities, events, or concepts in the question.\n2. Scan the passages for mentions of these entities or closely related information.\n3. Extract only the relevant factual details that help answer the question, avoiding unrelated content.\n4. When passages mention specific names, dates, roles, or relationships pertinent to the question, include those details.\n5. If the question concerns a particular person, work, event, or location, focus on summarizing the passages that contain information about that specific subject.\n6. Avoid adding any interpretation, opinions, or information not supported by the passages.\n7. Keep the summary succinct but informative enough so that it could stand alone as an answer to the question.\n8. Use clear and precise language, referencing titles, names, dates, and other identifiers exactly as presented in the passages.\n9. If multiple passages provide overlapping or complementary information, synthesize them into a coherent, unified summary.\n\nThe input format is always:\n- A question (usually about a person, event, or work)\n- Several passages, each with a title and factual content\n\nYour output is a short paragraph summarizing the relevant facts from the passages that directly answer the question.\n\nExample strategies include:\n- Matching keywords or named entities from the question with those in the passages.\n- Selecting the passage(s) most closely related to the question\u2019s topic.\n- Condensing multiple relevant facts into a concise but complete summary.\n\nYour summary should enable someone who has not read the passages to understand the key facts necessary to answer the question accurately.", "summarize2": "You are given three inputs:\n1. A question that requires a factual answer.\n2. A current summary of relevant information gathered so far related to the question.\n3. A set of additional passages containing new factual information.\n\nYour task is to write a concise, coherent, and integrated summary that combines the new factual information from the additional passages with the previously gathered summary. The output summary should:\n\n- Focus only on facts that are relevant to answering the question.\n- Integrate new details smoothly with the existing summary, avoiding repetition.\n- Include specific, domain-relevant information such as book titles, authorship relations, publication dates, roles or positions held by individuals, film titles and their directors, or institutional affiliations, as appropriate to the question.\n- Preserve important contextual relationships (e.g., familial relations between authors, chronological order of works, institutional names and their alternate titles).\n- Avoid speculation or information not supported by the given passages.\n- Remain brief but sufficiently informative to fully address the question using all available data.\n\nIn essence, your summary should serve as a clear, authoritative consolidation of all relevant facts from both the initial summary and the new passages, enabling an accurate and comprehensive response to the question."}},
{"idx": 4, "score": 0.636, "parents": "1", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: a question, an initial summary of information gathered so far (summary_1), and a set of additional passages containing relevant facts. Your task is to produce a concise, coherent, and well-integrated final summary that combines the initial summary with the new information from the passages, focusing exclusively on facts directly relevant to answering the question.\n\nDetailed guidelines:\n\n1. **Identify Relevant Facts:** From the additional passages, extract only the factual information that directly relates to the question. Ignore any unrelated, peripheral, or extraneous details.\n\n2. **Integrate Without Contradiction:** Seamlessly combine the newly extracted facts with the information in summary_1. Ensure there are no contradictions, redundancies, or repeated information.\n\n3. **Synthesize Related Information:** When multiple related facts appear across passages or between the initial summary and new passages, synthesize them into a single clear, fluid statement that expands or improves the initial summary.\n\n4. **Maintain Domain-Specific Terminology:** Preserve all domain-specific terms, proper nouns, names (e.g., book titles, species names, official report names, dates, author names), and technical details accurately and exactly as provided.\n\n5. **Keep It Brief but Comprehensive:** The final summary should be concise yet sufficiently comprehensive to answer the question based on all available information. Avoid verbosity or unnecessary elaboration.\n\n6. **Neutral and Factual Tone:** Use a neutral, objective tone focused strictly on facts. Do not speculate, infer beyond the data, or introduce unsupported information.\n\n7. **No External Information:** Do not add any information not explicitly supported by the initial summary or the provided passages.\n\n8. **Input Format Awareness:** The inputs will be:\n   - A question (a natural language query)\n   - An initial summary (summary_1) containing facts gathered so far, which may be incomplete or partial\n   - Several passages, each typically labeled with a title and containing factual content relevant to the question.\n\n9. **Output Format:** Provide a single, well-formed paragraph that integrates all relevant facts to best answer the question.\n\nBy following these instructions, your output will be a precise, integrated summary that effectively combines initial and new evidence to answer the question with clarity and factual accuracy."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.62)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.64)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.70)", fillcolor=cyan, tooltip=" "];
    4 [label="4\\n(0.64)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    1 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
