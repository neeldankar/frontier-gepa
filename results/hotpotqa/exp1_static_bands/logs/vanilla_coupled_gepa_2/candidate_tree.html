<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }

<body>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.6924, "parents": "0", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Your task is to write a concise summary of only the factual information in the passages that is relevant to answering the question. \n\n- Focus strictly on facts explicitly mentioned in the passages; do not infer or add information beyond what is provided.\n- If the passages contain details about people, events, concepts, or entities related to the question, include those relevant facts succinctly.\n- If the passages mention multiple related entities or concepts, include only those that directly help answer the question.\n- If the passages do not provide an answer to the question, summarize the relevant facts that clarify what information is missing.\n- Avoid unnecessary detail, opinions, or explanations; keep the summary brief and focused on the factual content.\n- Use clear and precise language to convey the relevant facts.\n- The input format consists of a question and multiple passages, each passage identified by a title and containing text relevant to the domain of the question.\n- The passages may cover different topics or entities; your summary should identify and extract only those facts that help address the question.\n- Your summary should be usable as a factual basis to answer the question or to identify that the answer is not present in the passages.\n\nExample strategies to apply:\n- Identify key entities or terms in the question.\n- Scan passages for these entities or related concepts.\n- Extract factual statements about these entities that are relevant to the question.\n- If the question asks for a specific fact (e.g., a year, a definition, a characteristic), report that fact if available; otherwise, state that the fact is not provided in the passages.\n\nBy following these guidelines, your summary will effectively synthesize the relevant information from the passages to support answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 2, "score": 0.642, "parents": "0", "role": "", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Your task is to write a concise summary that includes only the key factual information from the passages that directly helps answer the question. Focus on extracting relevant named entities, relationships, roles, and specific facts mentioned in the passages that pertain to the question. \n\n- Identify and include exact names, titles, roles, organizations, dates, and other concrete details that are clearly connected to the question.\n- If the passages contain multiple entities or facts, filter out information unrelated to the question and avoid adding any interpretation or information not present in the passages.\n- If the passages do not provide relevant information to answer the question, explicitly state that no relevant information is available.\n- Use clear and direct language, avoiding unnecessary elaboration or speculation.\n- The summary should be brief but complete enough to fully address the question based on the passages provided.\n\nThis task requires careful reading comprehension, entity recognition, and factual extraction skills to produce a focused and accurate summary for the question at hand.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},

ehension, entity recognition, and strict factual extraction without adding or inferring details beyond the provided passages. Your output should be a focused, accurate, and minimal summary that fully answers the question based solely on the passages given.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 4, "score": 0.5989, "parents": "2", "role": "Pareto Front", "components": {"final_answer": "You will be given a question and multiple summaries containing information relevant to answering that question. Your task is to provide a concise and accurate answer to the question based solely on the information in the summaries. \n\n- Respond with only the final answer as a short phrase, entity name, or a list of entities if applicable.\n- Do not include any explanations, reasoning steps, or additional commentary.\n- If multiple entities are required to fully answer the question, list them clearly, separated by \"and\" or commas as appropriate.\n- Extract and synthesize the key information from all summaries to produce the most precise and relevant answer.\n- The answer should directly address the question using exact names, titles, or terms found in the summaries.\n- Maintain fidelity to the factual details and specific wording presented in the summaries, especially for domain-specific names, book titles, or proper nouns.\n- Avoid introducing any external information not contained in the summaries.", "summarize1": "You are given a question and a set of passages. Your task is to write a concise summary that includes only the key factual information from the passages that directly helps answer the question. Focus on extracting relevant named entities, relationships, roles, and specific facts mentioned in the passages that pertain to the question. \n\n- Identify and include exact names, titles, roles, organizations, dates, and other concrete details that are clearly connected to the question.\n- If the passages contain multiple entities or facts, filter out information unrelated to the question and avoid adding any interpretation or information not present in the passages.\n- If the passages do not provide relevant information to answer the question, explicitly state that no relevant information is available.\n- Use clear and direct language, avoiding unnecessary elaboration or speculation.\n- The summary should be brief but complete enough to fully address the question based on the passages provided.\n\nThis task requires careful reading comprehension, entity recognition, and factual extraction skills to produce a focused and accurate summary for the question at hand.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 5, "score": 0.623, "parents": "3", "role": "Pareto Front", "components": {"final_answer": "You will be given a question along with multiple summarized pieces of information relevant to answering that question. Your task is to determine the concise, factual answer to the question based solely on the provided summaries. \n\n- Respond only with the short phrase or entity that directly answers the question.\n- Do not provide any explanations, additional context, or commentary.\n- If the summaries contain conflicting or incomplete information, select the best-supported, most specific answer available.\n- Use domain-specific knowledge only if it is clearly supported by the summaries.\n- Answers should be precise and unambiguous, reflecting the key factual detail asked for (e.g., a name, date, location, title).\n- If the question asks for a fact such as a person\u2019s name, date, or place, provide exactly that without any extra words.\n- In cases where the exact fact is not explicitly stated in the summaries, do not guess; respond only with what is explicitly supported.\n- Summaries may include domain-specific details such as legal reports, historical events, film release dates, or biographical information. Use these details to identify the correct answer.\n- The input format consists of a question followed by one or more summaries. Each summary may provide partial or overlapping information. Integrate these to derive the final answer.\n\nExample:  \nQuestion: What was the name of the lawyer who took the main role in the report that helped land Pete Rose a lifetime suspension from baseball?  \nSummaries: Mention John M. Dowd and the \"Dowd Report\" linked to Pete Rose\u2019s suspension.  \nAnswer: John M. Dowd\n\nYour response should always be a succinct factual answer extracted from the provided summaries only.", "summarize1": "You are given a question and a set of passages. Your task is to produce a concise, factual summary that directly answers the question by extracting only the relevant information from the passages.\n\nFollow these detailed guidelines:\n\n1. Extract and include only key factual information that directly pertains to the question.\n2. Include exact named entities such as full names, titles, roles, organizations, locations, dates, and other concrete facts clearly connected to the question.\n3. Identify and present explicit relationships or comparisons (e.g., birth dates, affiliations, roles) only if they are clearly stated in the passages.\n4. If multiple entities or facts appear, filter out any information unrelated to the question or irrelevant details.\n5. Do not add any interpretation, inference, or information not explicitly present in the passages.\n6. When the passages do not contain relevant information to answer the question, explicitly state: \"No relevant information is available.\"\n7. Use clear, direct, and unambiguous language.\n8. Keep the summary brief but complete enough to fully address the question based on the passages.\n9. When the question involves comparisons (e.g., who is older), include only the relevant data points available (e.g., birth dates) and note if one entity is not mentioned.\n10. If the question involves temporal ordering (e.g., after a certain date), confirm the date references from the passages and include only works or events explicitly dated after that point.\n11. Avoid unnecessary elaboration, speculation, or extra context beyond what is strictly necessary to answer the question.\n\nThis task requires precise reading comprehension, entity recognition, and strict factual extraction without adding or inferring details beyond the provided passages. Your output should be a focused, accurate, and minimal summary that fully answers the question based solely on the passages given.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 6, "score": 0.6586, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages containing factual information. Your task is to write a brief, focused summary of the facts from the passages that are directly relevant to answering the question.  \n\nTo do this effectively:  \n- Carefully identify the key entities, attributes, or comparisons asked about in the question (such as people\u2019s nationalities, birthdates, company headquarters, or relationships between entities).  \n- Extract only the factual information from the passages that pertains specifically to those entities or attributes. Do not add any information not supported by the passages.  \n- If the passages provide conflicting or partial information, summarize what is clearly stated without making assumptions or guesses.  \n- When multiple passages mention the same entity, consolidate the relevant facts into a concise summary.  \n- Avoid including unrelated background details or extensive context unless it directly supports answering the question.  \n\nThe goal is to produce a brief, factual summary that a reader could use to answer the question based solely on the information given, without extraneous information or speculation.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.69)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.64)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.65)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.60)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.62)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.66)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    2 -> 4;
    3 -> 5;
    0 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
