<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5963, "parents": "seed", "role": "Seed", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}},
{"idx": 1, "score": 0.6094, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: (1) a question, (2) a summary of information gathered so far that partially or fully addresses the question, and (3) a set of additional passages containing relevant or potentially relevant information.\n\nYour task is to write a concise, coherent summary that integrates the new information from the additional passages with the previously gathered summary to produce an updated, factually accurate overview focused solely on the facts relevant to answering the question.\n\nKey points to follow:\n\n- Identify the main entities, concepts, or facts in the question.\n- Combine the initial summary and new passages by extracting and merging relevant factual information that helps answer the question.\n- Exclude information that is unrelated, tangential, or does not contribute to answering the question.\n- If the new passages provide no additional relevant information, clearly state that the previously gathered facts remain the best available.\n- When multiple passages mention similar entities or facts, synthesize them into a unified statement.\n- Maintain clarity and brevity; do not include speculation or unsupported details.\n- Use exact or commonly accepted names, nicknames, or terms as referenced in the passages.\n- If the question involves specific attributes (e.g., a nickname, product, or promoter), explicitly include those details if found.\n- Avoid introducing new information not present in either the initial summary or the provided passages.\n\nThe goal is to produce an updated, fact-based summary that efficiently consolidates all relevant knowledge from both the initial summary and the new passages to directly address the question."}},
{"idx": 2, "score": 0.5827, "parents": "1", "role": "Pareto Front", "components": {"final_answer": "You are given a question and multiple summaries of gathered information relevant to answering that question. Your task is to provide a concise and direct answer to the question based solely on the information contained in the summaries. \n\nGuidelines:\n- Respond with only the short phrase or entity that answers the question; do not include any explanation, reasoning, or additional commentary.\n- If the summaries provide no information to answer the question, respond with a clear and definitive short answer such as \"0\" or the most contextually appropriate minimal response indicating absence of relevant data.\n- When multiple summaries provide conflicting or overlapping information, synthesize the key factual details to produce the most accurate and concise answer possible.\n- Focus on domain-specific terminology and factual details mentioned in the summaries, such as official tags, titles, roles, or numeric values, as these often form the correct answer.\n- The answer should be precise, reflecting exactly what is stated or strongly implied in the summaries without adding external knowledge.\n\nThis approach ensures clarity and precision in answering questions from summarized content, suitable for fact-based queries involving names, durations, official designations, or descriptive labels.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs: (1) a question, (2) a summary of information gathered so far that partially or fully addresses the question, and (3) a set of additional passages containing relevant or potentially relevant information.\n\nYour task is to write a concise, coherent summary that integrates the new information from the additional passages with the previously gathered summary to produce an updated, factually accurate overview focused solely on the facts relevant to answering the question.\n\nKey points to follow:\n\n- Identify the main entities, concepts, or facts in the question.\n- Combine the initial summary and new passages by extracting and merging relevant factual information that helps answer the question.\n- Exclude information that is unrelated, tangential, or does not contribute to answering the question.\n- If the new passages provide no additional relevant information, clearly state that the previously gathered facts remain the best available.\n- When multiple passages mention similar entities or facts, synthesize them into a unified statement.\n- Maintain clarity and brevity; do not include speculation or unsupported details.\n- Use exact or commonly accepted names, nicknames, or terms as referenced in the passages.\n- If the question involves specific attributes (e.g., a nickname, product, or promoter), explicitly include those details if found.\n- Avoid introducing new information not present in either the initial summary or the provided passages.\n\nThe goal is to produce an updated, fact-based summary that efficiently consolidates all relevant knowledge from both the initial summary and the new passages to directly address the question."}},
{"idx": 3, "score": 0.6264, "parents": "0", "role": "Pareto Front", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You are given a question and a set of passages. Write a brief summary of the facts in the passages that are relevant to answering the question.", "summarize2": "You are given three inputs:\n1. A question that asks for specific factual information.\n2. A summary of information gathered so far that partially answers or relates to the question.\n3. A set of additional passages containing new information.\n\nYour task is to write a concise, coherent summary of the relevant facts needed to answer the question, integrating the new information from the passages with the previously gathered summary. Specifically:\n\n- Identify and extract facts from the new passages that directly relate to the entities, dates, places, events, or concepts mentioned in the question or existing summary.\n- Combine these new facts with the information from the initial summary, ensuring no contradictions and maintaining factual accuracy.\n- Focus only on information that advances or clarifies the answer to the question; omit unrelated details.\n- When multiple entities are mentioned (e.g., multiple people related to a discovery), clearly distinguish between them and their relevant attributes (e.g., birth year, profession).\n- If the question asks for a specific fact (e.g., birth year, location, or a name), highlight the information that directly answers it.\n- Avoid listing irrelevant or tangential information from the passages, even if it is interesting or detailed.\n- Present the summary in a clear, logically structured manner, suitable for use as a direct response or as a knowledge base for answering the question.\n\nThis task requires careful synthesis of domain-specific factual data such as biographical details, geographic distributions, filmography timelines, and scientific or historical attributions. The goal is to produce a brief but comprehensive factual summary that accurately integrates new evidence with prior knowledge to directly address the question."}},
{"idx": 4, "score": 0.6543, "parents": "0", "role": "Best", "components": {"final_answer": "You are given a question and summaries of the information gathered to answer it. Provide the answer to the question. Respond with only the answer, as a short phrase or entity, with no explanation.", "summarize1": "You will be given a question and a set of passages. Your task is to write a concise summary of the factual information contained in the passages that is directly relevant to answering the question. \n\n- Focus only on facts explicitly stated or clearly implied in the passages.\n- Do not include information or inferences that are not supported by the passages.\n- When multiple passages mention different entities or topics, isolate and summarize only the information that relates to the entities or concepts mentioned in the question.\n- If the question involves identifying a relationship (e.g., a person playing for a club founded in a certain year, or whether two airports are located in the same state), extract and summarize the relevant facts from the passages that help establish or refute that relationship.\n- If the passages mention several people or organizations but none match the question\u2019s subject, state that the passages do not provide information about the question\u2019s subject.\n- Maintain clarity and brevity; the summary should be just enough to answer or inform the question based on the passages.\n- Use exact names, dates, and locations as presented in the passages to avoid ambiguity.\n- Avoid extraneous details that do not help answer the question.\n- When the question asks about location or affiliation (e.g., where a legislative body meets, or where an airport is located), include the relevant geographic or institutional facts from the passages.\n- When the question involves multiple entities (e.g., two airports), separately summarize the relevant facts about each entity to clarify similarities or differences.\n\nThis task requires careful reading comprehension and selective extraction of facts to produce a focused and accurate factual summary tailored to the question, relying solely on the given passages.", "summarize2": "You are given a question, a summary of the information gathered so far, and a set of additional passages. Write a brief summary of the facts relevant to answering the question, combining the new passages with what was already gathered."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.61)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.58)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.63)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.65)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    0 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
